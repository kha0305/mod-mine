plugins {
    id "architectury-plugin" version "3.4.156" apply false
    id "net.fabricmc.fabric-loom" version "${fabric_loom_version}" apply false
    id "net.neoforged.moddev" version "${moddevgradle_version}" apply false
}

subprojects {
    apply plugin: "java"

    group = rootProject.mod_group
    version = rootProject.mod_version

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(rootProject.java_version)
        }
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release.set(Integer.parseInt(rootProject.java_version))
    }
}
